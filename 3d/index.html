<template id="t-research">
  <p class="eyebrow">Research interests</p><h2>Four interests, one question</h2>
  <p class="lede">What happens to people when software and AI organize their work — and what should we build once we know? I study it with mixed methods, then write the tools the findings call for.</p>
  <ul>
    <li style="--k:var(--eng)"><h3>AI and the future of work</h3><p>How automation, generative AI and algorithmic management reshape jobs, skills and inequality, starting with the workers who feel it first. Published in <i>Sociology Lens</i>, with a second study at the revise-and-resubmit stage.</p></li>
    <li style="--k:var(--rsch)"><h3>Human–computer interaction</h3><p>How students and workers actually use AI tools. I analyze thousands of student conversations with an AI tutor chatbot and build learning tools for Gravity Spy, the citizen-science project that supports LIGO.</p></li>
    <li style="--k:var(--teach)"><h3>Digital labor and online freelancers</h3><p>Platform work and the algorithms that manage it. My master's thesis follows Bangladeshi freelancers on Upwork and Fiverr through 24 in-depth interviews — work I did myself first, with 100+ client projects.</p></li>
    <li style="--k:var(--labor)"><h3>ICT for development (ICT4D)</h3><p>How information systems, platforms and mobile internet open, or close, economic opportunity in the Global South, and how AI is reshaping that path for workers in countries like Bangladesh.</p></li>
  </ul>
  <a class="more" href="/research/">Open the research page →</a>
</template>

  let d = Math.max((st.h / 2) / Math.tan(vf * free / 2), (st.w / 2) / Math.tan(hf / 2)) * 1.06 + .15;
  d = Math.min(d, Math.abs(n.z) > .5 && Math.abs(n.y) < .5 ? 10.5 : 7.6);
  const pos = c.clone().addScaledVector(n, d);
  pos.x = THREE.MathUtils.clamp(pos.x, -RW + .3, RW - .3); pos.z = THREE.MathUtils.clamp(pos.z, -RD + .3, 6); pos.y = THREE.MathUtils.clamp(pos.y, .8, RH - .2);
  // aim a little below the content so it sits in the upper part of the screen
  const lk = c.clone(); lk.y -= d * Math.tan(vf / 2) * (1 - free) * .95;
  return { pos, look: lk };
}
const DOORVIEW = () => narrow()
  ? { pos: new THREE.Vector3(0, 1.55, 4.9), look: new THREE.Vector3(0, .95, 0) }
  : { pos: new THREE.Vector3(.55, 1.6, 4.3), look: new THREE.Vector3(-.75, 1.3, 0) };
const tweens = [];
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tween(dur, fn){ return new Promise(res => { if (reduce || dur <= 0) { fn(1); res(); return; } tweens.push({ t: 0, dur, fn, res }); }); }
function flyTo(target, dur = 2){
  const p0 = camera.position.clone(), l0 = look.clone(), { pos, look: l1 } = target;
  const lift = p0.distanceTo(pos) > 4 ? .45 : .12;
  const crosses = (p0.z + 5.55) * (pos.z + 5.55) < 0 && Math.abs(p0.x + pos.x) / 2 < 1.6;   // the path cuts through the portrait
  const side = crosses ? (pos.x + p0.x >= 0 ? 1 : -1) * 2.1 : 0;
  return tween(dur, k => { const e = ease(k); camera.position.lerpVectors(p0, pos, e); camera.position.y += Math.sin(Math.PI * e) * lift; camera.position.x += Math.sin(Math.PI * e) * side; look.lerpVectors(l0, l1, e); });
}

/* ================= STORY & UI ================= */
let where = 'door', busy = false;
const visited = new Set();
const dock = $('#dock'), say = $('#say'), opts = $('#opts'), ask = $('#ask');
let typeTimer = null;
function speak(text){
  clearInterval(typeTimer);
  if (reduce) { say.textContent = text; return; }
  let i = 0; say.innerHTML = '<span class="caret"></span>';
  typeTimer = setInterval(() => { i += 2; say.innerHTML = text.slice(0, i).replace(/</g, '&lt;') + '<span class="caret"></span>'; if (i >= text.length) { clearInterval(typeTimer); say.textContent = text; } }, 22);
}
function option(label, icon, k, fn, n, cls = ''){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'opt ' + cls; b.style.setProperty('--k', k); b.style.setProperty('--n', n);
  b.innerHTML = (icon ? `<i aria-hidden="true">${icon}</i>` : '') + label; b.addEventListener('click', fn); return b;
}
function showMenu(question, here){
  ask.textContent = question; opts.innerHTML = ''; let n = 0;
  if (here) opts.appendChild(option('Read it all', '📖', 'var(--txt)', () => openDrawer(here), n++, 'read'));
  ORDER.filter(s => s !== here).forEach(s => { const S = STATIONS[s]; opts.appendChild(option(S.label + (visited.has(s) ? ' ✓' : ''), S.icon, S.k, () => go(s), n++)); });
  if (here) opts.appendChild(option('Back to Naim', '👋', '#9AA6C2', () => greet(false), n++, 'plain'));
  opts.appendChild(option('Leave the office', '🚪', '#9AA6C2', leave, n++, 'plain'));
  dock.classList.add('on');
}
const hideDock = () => dock.classList.remove('on');
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1700); }

async function openDoor(dur){
  creakSound();
  const l0 = officeLights.map(l => l.intensity);
  await tween(dur, k => {
    const e = ease(k);
    hinge.rotation.y = e * 1.85;
    officeLights.forEach((l, i) => l.intensity = THREE.MathUtils.lerp(l0[i], l.userData.full, e));
    spill.intensity = Math.sin(e * Math.PI) * 6 + e * 1.5;
    dust.material.opacity = e * .5; leak.material.opacity = 1 - e; hallLight.intensity = 9 - e * 4;
  });
}
async function closeDoor(dur){
  await tween(dur, k => { const e = ease(k); hinge.rotation.y = 1.85 * (1 - e); officeLights.forEach(l => l.intensity = l.userData.full * (1 - e)); dust.material.opacity = .5 * (1 - e); hallLight.intensity = 5 + e * 4; spill.intensity = 1.5 * (1 - e); leak.material.opacity = e; });
}
async function knock(){
  if (busy || where !== 'door') return; busy = true;
  $('#doorUI').classList.add('hide');
  for (let i = 0; i < 3; i++) { knockSound(); await tween(.14, k => { hinge.position.z = -Math.sin(k * Math.PI) * .012; }); await wait(140); }
  await wait(450); toast('Come in! 🙂'); await wait(650);
  await openDoor(1.6);
  await flyTo(fit(RECEPTION), 2.6);
  busy = false; greet(true);
}
async function skipIn(){
  if (busy || where !== 'door') return; busy = true; $('#doorUI').classList.add('hide'); ac();
  await openDoor(.9); await flyTo(fit(RECEPTION), 2); busy = false; greet(true);
}
async function greet(first){
  if (busy) return;
  closeDrawer();
  if (where !== 'reception' && where !== 'door') { busy = true; hideDock(); await flyTo(fit(RECEPTION), 1.8); busy = false; }
  where = 'reception'; chime();
  speak(first ? "Hi, I'm Naim! Thanks for knocking. I'm a PhD researcher at the Syracuse iSchool and a full-stack developer. What would you like to know about me?"
              : "Back at the front desk. What else would you like to know?");
  showMenu(first ? 'Pick anything' : 'What else would you like to know?');
  history.replaceState(null, '', location.pathname);
}
async function go(s){
  if (busy || !STATIONS[s]) return; busy = true;
  closeDrawer(); hideDock();
  if (s === 'gallery') loadPhotos();
  where = s;
  await flyTo(fit(STATIONS[s]), 2.1);
  visited.add(s); busy = false;
  if (s === 'experience') typed = 0;
  speak(STATIONS[s].say);
  showMenu('What else would you like to know?', s);
  history.replaceState(null, '', '#' + s);
}
async function leave(){
  if (busy) return; busy = true; closeDrawer(); hideDock();
  if (where !== 'reception') await flyTo(fit(RECEPTION), 1.6);
  await flyTo(DOORVIEW(), 2.2);
  await closeDoor(1.1);
  where = 'door'; busy = false;
  toast('Thanks for stopping by! 👋');
  $('#doorUI').classList.remove('hide');
  history.replaceState(null, '', location.pathname);
}
$('#knockBtn').addEventListener('click', knock);
$('#skipBtn').addEventListener('click', skipIn);

const drawer = $('#drawer');
function openDrawer(s){ $('#drawerBody').innerHTML = $('#t-' + s).innerHTML; drawer.classList.add('on'); drawer.setAttribute('aria-hidden', 'false'); $('#drawerX').focus(); }
function closeDrawer(){ drawer.classList.remove('on'); drawer.setAttribute('aria-hidden', 'true'); }
$('#drawerX').addEventListener('click', closeDrawer);

const lb = $('#lb'); let shown = 0;
function openPhoto(i){
  shown = (i + PHOTOS.length) % PHOTOS.length; const [slug, title] = PHOTOS[shown];
  $('#lbImg').src = `/images/gallery/naim-bin-hasan-${slug}-1400.webp?v=4`; $('#lbImg').alt = 'Naim Bin Hasan: ' + title; $('#lbCap').textContent = title;
  if (!lb.open) lb.showModal();
}
$('#lbX').addEventListener('click', () => lb.close());
$('#lbP').addEventListener('click', () => openPhoto(shown - 1));
$('#lbN').addEventListener('click', () => openPhoto(shown + 1));
lb.addEventListener('keydown', e => { if (e.key === 'ArrowRight') openPhoto(shown + 1); if (e.key === 'ArrowLeft') openPhoto(shown - 1); });
lb.addEventListener('click', e => { if (e.target === lb || e.target.tagName === 'FIGURE') lb.close(); });

addEventListener('keydown', e => {
  if (lb.open) return;
  if (e.key === 'Escape') { if (drawer.classList.contains('on')) closeDrawer(); else if (where !== 'door' && where !== 'reception') greet(false); }
  const n = parseInt(e.key, 10); if (n >= 1 && n <= ORDER.length && where !== 'door') go(ORDER[n - 1]);
});

/* pointer: hover, click, a gentle look-around */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), down = { x: 0, y: 0 };
let mx = 0, my = 0, hover = null;
canvas.addEventListener('pointermove', e => { ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); mx = ptr.x; my = ptr.y; });
canvas.addEventListener('pointerdown', e => { down.x = e.clientX; down.y = e.clientY; ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); });
canvas.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8 || busy) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  const info = hit(); if (!info) return;
  if (info.kind === 'door') { if (where === 'door') knock(); return; }
  if (where === 'door') return;
  if (info.kind === 'naim') { greet(false); return; }
  if (info.kind === 'photo') { if (where === 'gallery') openPhoto(info.i); else go('gallery'); return; }
  if (info.kind === 'station') { if (where === info.station) openDrawer(info.station); else go(info.station); }
});
function hit(){ ray.setFromCamera(ptr, camera); const h = ray.intersectObjects(picks, false)[0]; return h ? h.object.userData.pick : null; }

/* ================= LOOP ================= */
function layout(){
  setFov(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  if (!busy) { const t = where === 'door' ? DOORVIEW() : where === 'reception' ? fit(RECEPTION) : fit(STATIONS[where]); camera.position.copy(t.pos); look.copy(t.look); }
}
addEventListener('resize', layout);
setFov();
{ const d = DOORVIEW(); camera.position.copy(d.pos); look.copy(d.look); }

const clock = new THREE.Clock(), aim = new THREE.Vector3();
let lastScreen = 0;
function frame(){
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.res(); } }

  const h = !busy && !coarse ? hit() : null;
  const want = h && !(where === 'door' && h.kind !== 'door') ? h : null;
  if (want !== hover) { if (hover) hover.obj.scale.copy(hover.base); hover = want; canvas.style.cursor = hover ? 'pointer' : ''; }
  if (hover) hover.obj.scale.lerp(hover.base.clone().multiplyScalar(1.04), .25);

  if (where === 'door' && !busy) leak.material.color.setRGB(1, .85, .66).multiplyScalar(1.6 + Math.sin(t * 2) * .5);
  naim.position.y = 2.08 + Math.sin(t * 1.3) * .025;
  neon.material.color.setRGB(1, .44, .66).multiplyScalar(Math.random() < .012 ? 1.4 : 3.1);
  dust.rotation.y = t * .01;

  if (where === 'experience') {
    if (typed < LOGLEN + 2) typed += dt * 75;
    if (t - lastScreen > .05) { drawScreen(); lastScreen = t; }
  }

  const amp = where === 'door' ? .3 : .14;
  aim.copy(look); aim.x += mx * amp; aim.y += my * amp * .6;
  camera.lookAt(aim);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => $('#loader').classList.add('gone'), 200);

/* deep links (/3d/#education) skip the knock */
const startAt = location.hash.slice(1);
if (STATIONS[startAt]) {
  hinge.rotation.y = 1.85; officeLights.forEach(l => l.intensity = l.userData.full); dust.material.opacity = .5; leak.material.opacity = 0;
  $('#doorUI').classList.add('hide'); where = 'reception';
  const r = fit(RECEPTION); camera.position.copy(r.pos); look.copy(r.look);
  go(startAt);
}
</script>
