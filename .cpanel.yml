---
# cPanel > Git Version Control > "Deploy HEAD Commit" copies the site into public_html.
# Files already in public_html that aren't in the repo are left alone.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/rsync -a --exclude='.git' --exclude='.cpanel.yml' --exclude='.gitignore' --exclude='.nojekyll' ./ $DEPLOYPATH
