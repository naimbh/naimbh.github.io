---
# cPanel > Git Version Control > "Deploy HEAD Commit" copies the site into public_html.
# Uses cp (rsync isn't available on this host). Files in public_html that aren't in the repo are left alone.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/cp -R ./. $DEPLOYPATH
    - /bin/rm -rf ${DEPLOYPATH}.git ${DEPLOYPATH}.cpanel.yml ${DEPLOYPATH}.gitignore ${DEPLOYPATH}.nojekyll
